syntax = "proto3";
package pnd.robot;

option go_package = "pnd/robot";

// ==========================================================================
// PND Robot Control Service
// 对齐 FSM 架构：STOP / ZERO / STAND_WALK / MULTI_AGENT / MOTION_TRACK
// gRPC 默认端口: 50051, domain_id: 1
// ==========================================================================

service RobotControl {
  // 切换状态机模式
  rpc SetMode (SetModeRequest) returns (SetModeResponse);

  // 设置行走速度（预留，当前不接入）
  rpc SetVelocity (SetVelocityRequest) returns (SetVelocityResponse);

  // 设置站立高度（预留，当前不接入）
  rpc SetHeight (SetHeightRequest) returns (SetHeightResponse);

  // 动作文件播放控制（MULTI_AGENT / MOTION_TRACK）
  rpc SetMotion (SetMotionRequest) returns (SetMotionResponse);

  // 轨迹跟踪文件切换（MOTION_TRACK，支持运行中平滑切换）
  rpc SetTrackingMotion (SetTrackingMotionRequest) returns (SetTrackingMotionResponse);

  // 查询机器人状态
  rpc GetRobotState (GetRobotStateRequest) returns (GetRobotStateResponse);

  // 切换控制范式 (Traditional / RL)，经 DDS ControlModeCmd_ 下发至 C++ 侧
  rpc SetControlMode (SetControlModeRequest) returns (SetControlModeResponse);

  // 读取 DDS rt/control_mode_state 反馈的控制范式
  rpc GetControlState (GetControlStateRequest) returns (GetControlStateResponse);

  // 关闭控制器（预留）
  rpc Shutdown (ShutdownRequest) returns (ShutdownResponse);
}

// ==========================================================================
// SetMode — 切换状态机
// 状态名使用字符串（与 FSM 注册表一致），如：
//   "STOP", "ZERO", "STAND_WALK", "MULTI_AGENT", "MOTION_TRACK"
// 新增状态机只需在注册表添加，无需修改 proto。
// ==========================================================================

message SetModeRequest {
  string target_state = 1;
}

message SetModeResponse {
  bool success = 1;
  string message = 2;
  string current_state = 3;
}

// ==========================================================================
// SetVelocity — 设置行走速度（预留，当前不接入）
// ==========================================================================

message SetVelocityRequest {
  // 归一化速度 [-1.0, 1.0]
  double vx = 1;       // 前进/后退
  double vy = 2;       // 左移/右移
  double vyaw = 3;     // 转向
}

message SetVelocityResponse {
  bool success = 1;
  string message = 2;
}

// ==========================================================================
// SetHeight — 设置站立高度（预留，当前不接入）
// ==========================================================================

message SetHeightRequest {
  // 归一化高度 [-1.0, 1.0]，0 为默认站高
  double height = 1;
}

message SetHeightResponse {
  bool success = 1;
  string message = 2;
}

// ==========================================================================
// SetMotion — 动作文件播放（MULTI_AGENT 上半身动作）
// ==========================================================================

message SetMotionRequest {
  enum Command {
    PLAY = 0;    // 播放（需提供 motion_file 路径）
    STOP = 1;    // 停止当前播放
  }
  Command command = 1;
  // 动作文件路径（由上层 client 传入）
  string motion_file = 2;
}

message SetMotionResponse {
  bool success = 1;
  string message = 2;
  string current_motion = 3;
  bool is_playing = 4;
}

// ==========================================================================
// SetTrackingMotion — 轨迹跟踪切换（MOTION_TRACK 状态下）
// 运行中调用会触发 TrajSwitchBlender 平滑过渡到新轨迹。
// ==========================================================================

message SetTrackingMotionRequest {
  // 轨迹文件路径（由上层 client 传入）
  string motion_file = 1;
}

message SetTrackingMotionResponse {
  bool success = 1;
  string message = 2;
  string current_tracking_motion = 3;
}

// ==========================================================================
// GetRobotState — 查询机器人状态
// ==========================================================================

message GetRobotStateRequest {}

message GetRobotStateResponse {
  bool success = 1;

  // ── 当前 FSM 状态 ──
  string fsm_state = 2;

  // ── 速度状态 ──
  double vx = 3;
  double vy = 4;
  double vyaw = 5;

  // ── 站立高度 ──
  double height = 6;

  // ── 动作播放状态（MULTI_AGENT） ──
  string current_motion_file = 7;
  bool motion_playing = 8;

  // ── 轨迹跟踪状态（MOTION_TRACK） ──
  string current_tracking_motion = 9;
  bool tracking_playing = 10;

  // ── 可切换模式列表 ──
  repeated string switchable_states = 11;

  // ── 当前状态下可用的操作（RPC 名称列表） ──
  // 如: ["SetVelocity", "SetHeight"] 或 ["SetMotion"] 或 ["SetTrackingMotion"]
  // client 应先检查此列表再调用对应 RPC，否则 server 会返回 success=false。
  repeated string available_actions = 12;
}

// ==========================================================================
// SetControlMode — 控制范式切换 (0=Traditional, 1=RL)
// ==========================================================================

message SetControlModeRequest {
  int32 domain_id = 1;    // 0=Traditional, 1=RL
}

message SetControlModeResponse {
  bool success = 1;
  string message = 2;
}

// ==========================================================================
// GetControlState — 读取 DDS rt/control_mode_state 反馈的控制范式
// ==========================================================================

message GetControlStateRequest {}

message GetControlStateResponse {
  bool success = 1;
  string message = 2;
  int32 domain_id = 3;    // 0=Traditional, 1=RL；-1 表示尚未收到 state
}

// ==========================================================================
// Shutdown — 关闭控制器（预留）
// ==========================================================================

message ShutdownRequest {
  bool force = 1;
}

message ShutdownResponse {
  bool success = 1;
  string message = 2;
}
